name: Build and Release SWStock

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        run: mvn clean test

      - name: Package Windows Binary & EXE
        run: mvn clean package -DskipTests

      - name: Build Windows Portable Distribution Bundle
        run: |
          chmod +x dist/build-windows-dist.sh
          ./dist/build-windows-dist.sh

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SWStock-Windows-x64
          path: dist/SWStock-Windows-x64.zip
          retention-days: 14

      - name: Create GitHub Release (on Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SWStock-Windows-x64.zip
          name: SWStock ${{ github.ref_name }}
          body: |
            ## SWStock - Versão ${{ github.ref_name }}
            
            ### 📦 Download para Windows
            - Baixe o arquivo **`SWStock-Windows-x64.zip`** abaixo.
            - Descompacte e execute **`SWStock.exe`**.
            - Não é necessário ter o Java instalado.
          draft: false
          prerelease: false
